# ============================================================================
# M29-3 演练 config（DRILL ONLY）——合成待签认，绝不等于 G7（F-2）治理配置签认。
# 本文件是 K-03（各级 attainment_floor，SDD L1740）与 K-08（promotion_streak /
# demotion_immediate，SDD L1745）的签认载体。
# 结构要求（dsm/config.py）：任何同时携带 grade_code 与 attainment_floor 的映射即
# 一条定级规则（:579-581 键位，[L1200]-[L1205]）；必须恰为 L1/L2/L3/L4 四级各一条
# （_GRADE_ORDER :584，[L493]/[L1200]）、attainment_floor 严格递减（ruling 10）、
# 每级 actions 非空（ruling 11）。行字段另须过 dsm/models.py:557 GradeRuleRow
# （frozen + extra=forbid，键位逐字镜像冻结 fixtures）。
# ============================================================================

grades:
  # K-03 各级 attainment_floor（SDD L1740：历史回测分位点 L1=P80 / L2=P50 /
  # L3=P20 与可接受淘汰比例联立求解）。出处：v1.1 代码拟定值 =
  # fixtures/input/grade_rule.jsonl（dsm/fixtures_gen.py:340 注释自述「门槛/连续期数
  # 均为合成治理值」）。合成待签认——非历史分位标定产物。
  # K-08 promotion_streak（每级，[L1204]）：出处同上 jsonl；SDD L1745 建议升级需
  # 2 期，本载荷 L1 行为 1 期，属演练夹具值，签认须与 K-09 周期联定复核。
  - grade_code: L1
    grade_label: SYNTH_L1
    attainment_floor: "1.00"
    evidence_class_min: A
    redline_pass_required: true
    promotion_streak: 1
    actions:
      - SYNTH_ACTION_L1
      - SYNTH_ACTION_MONITOR
    action_gate: SYNTH_GATE_L1
    max_grade_if_no_target: L3
  - grade_code: L2
    grade_label: SYNTH_L2
    attainment_floor: "0.90"
    evidence_class_min: B
    redline_pass_required: true
    promotion_streak: 0
    actions:
      - SYNTH_ACTION_L2
      - SYNTH_ACTION_MONITOR
    action_gate: SYNTH_GATE_L2
    max_grade_if_no_target: L3
  - grade_code: L3
    grade_label: SYNTH_L3
    attainment_floor: "0.70"
    evidence_class_min: C
    redline_pass_required: true
    promotion_streak: 0
    actions:
      - SYNTH_ACTION_L3
      - SYNTH_ACTION_MONITOR
    action_gate: SYNTH_GATE_L3
    max_grade_if_no_target: L3
  - grade_code: L4
    grade_label: SYNTH_L4
    attainment_floor: "0.00"
    evidence_class_min: D
    redline_pass_required: false
    promotion_streak: 0
    actions:
      - SYNTH_ACTION_L4
      - SYNTH_ACTION_MONITOR
    action_gate: SYNTH_GATE_L4
    max_grade_if_no_target: L4

# K-08 全局滞回默认（[L965] 明文默认 upgrade_consecutive_periods=2 /
# demotion_immediate=true，消费点 dsm/grading.py:86-91；每级 promotion_streak 优先）。
# 出处：契约明文默认 + tests/test_integration_spine.py:83-84 同值夹具。合成待签认。
policy:
  upgrade_consecutive_periods: 2
  demotion_immediate: true

# ---------------------------------------------------------------------------
# SOFT 红线扣减幅度（契约 L484：「SOFT 红线：命中 → 独立扣减（在等级判定之外单列），
# **不进加权**……扣减幅度由 grade_rules.yaml 配置」；同表 L990 同一口径）。
# 载体 = 本文件**顶层** soft_deductions 映射（主控裁决 ORCH-61，不得改写口径），
# 语义 = metric_id -> 0..1 扣减比率。它是 grades / policy 的**兄弟顶层键**，不是
# 任何一行定级规则的字段：dsm/models.py:557 GradeRuleRow 为 frozen + extra=forbid，
# 往某一行里塞 soft_deductions 必须抛错（本仓库 tests/test_config_soft_deductions.py
# 反向钉死这一点）。
# 消费点：dsm/redline.py:243-249 _deduction —— 按 ADJ-2 做成必填入参，缺失即抛错、
# 越出 0..1 即抛错，绝不自定数（H-5）；dsm/cli.py:456 _soft_deductions(app) 从本树
# 逐字读出，缺块则走 [L1080] 退出码 3 点名键位，shell 侧同样不自定数。
# 数值出处（R-12 禁编造，逐字照抄）：tests/test_integration_spine.py:84
#     GOVERNANCE['soft_deductions'] = {'M_OPTOUT_RATE': D('0.05')}
# 写法与同文件 attainment_floor: "1.00" 同风格（**字符串**，不是裸浮点）：比率经
# dsm/numeric.py 的 q12 定点化，H-4 明文 never float。
# 只有这一个 metric_id、这一个数值有出处。其余 SOFT 红线指标的扣减幅度，契约与夹具
# 均未给值，故**一律不补**——没有出处就是编造（R-12 / H-5）。
# 合成待签认（DRILL ONLY），非行方签认治理值（F-2）。
# ---------------------------------------------------------------------------
soft_deductions:
  M_OPTOUT_RATE: "0.05"
